name: render-short

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "sample/**"
      - "requirements.txt"
      - ".github/workflows/render.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # stock ubuntu ffmpeg has libx264; the script probes for it
      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Render
        run: |
          python scripts/make_short.py \
            --story sample/emu_storyboard.json \
            --out sample/emu \
            --offline

      - name: Show output
        run: |
          ls -lh sample/emu/emu_war_short.mp4
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 sample/emu/emu_war_short.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: emu-war-short
          path: sample/emu/emu_war_short.mp4
          if-no-files-found: error
          retention-days: 14
